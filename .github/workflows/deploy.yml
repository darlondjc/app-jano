name: Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/build-version.mjs
      - run: npx nx build web --base-href=/app-jano/
      # GitHub Pages não conhece rotas do SPA: 404.html serve o mesmo app.
      - run: cp dist/apps/web/browser/index.html dist/apps/web/browser/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/apps/web/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
