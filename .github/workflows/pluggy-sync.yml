name: Sincronizar Open Finance

# Duas vezes por dia, às 6h17 e 18h17 de Brasília (9h17 e 21h17 UTC; o Brasil não tem horário
# de verão desde 2019). Fora da hora cheia, quando a fila de agendamentos do GitHub é menor
# (no minuto 0 as execuções atrasavam até 10 h). A segunda pega o que o Meu Pluggy trouxe do
# banco depois da primeira; o que já foi gravado é pulado. Também dá para rodar à mão em
# Actions → Run workflow.
on:
  schedule:
    - cron: '17 9,21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pluggy-sync
  cancel-in-progress: false

jobs:
  sync:
    # Agendamentos só rodam no repositório original, nunca em forks.
    if: github.repository == 'darlondjc/app-jano'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # O log é público: a sincronização só imprime nomes de conta e contagens. Nunca usar --seco aqui.
      - name: Sincronizar
        env:
          PLUGGY_CLIENT_ID: ${{ secrets.PLUGGY_CLIENT_ID }}
          PLUGGY_CLIENT_SECRET: ${{ secrets.PLUGGY_CLIENT_SECRET }}
          PLUGGY_CONFIG: ${{ secrets.PLUGGY_CONFIG }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$PLUGGY_CONFIG" > pluggy.config.json
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase.json"
          npm run pluggy -- sync
