<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Primeiras metas mobile</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="jano.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="j-page" style="width: 390px; height: 844px; display: flex; flex-direction: column;">
  <header style="padding: 16px 16px 8px;">
    <div style="display: flex; gap: 6px;" role="img" aria-label="Passo 5 de 5"><i style="flex: 1; height: 4px; border-radius: 99px; background: var(--primary);"></i><i style="flex: 1; height: 4px; border-radius: 99px; background: var(--primary);"></i><i style="flex: 1; height: 4px; border-radius: 99px; background: var(--primary);"></i><i style="flex: 1; height: 4px; border-radius: 99px; background: var(--primary);"></i><i style="flex: 1; height: 4px; border-radius: 99px; background: var(--primary);"></i></div>
    <div class="j-cap" style="margin-top: 8px;">Passo 5 de 5</div>
  </header>
  <main style="flex: 1; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 16px; overflow: hidden;">
    <div>
      <h1 class="j-h1">Defina suas primeiras metas</h1>
      <p class="j-sub" style="margin: 8px 0 0;">Partimos da média dos seus últimos 3 meses. Ajuste como quiser.</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <label class="j-field"><span class="j-field__label" style="display: inline-flex; align-items: center; gap: 8px;"><i class="j-dotc" style="background: var(--cat-1);"></i>Moradia</span><span class="j-input"><span class="j-input__prefix">R$</span><input value="1.200,00"></span></label>
      <label class="j-field"><span class="j-field__label" style="display: inline-flex; align-items: center; gap: 8px;"><i class="j-dotc" style="background: var(--cat-3);"></i>Mercado</span><span class="j-input"><span class="j-input__prefix">R$</span><input value="900,00"></span></label>
      <label class="j-field"><span class="j-field__label" style="display: inline-flex; align-items: center; gap: 8px;"><i class="j-dotc" style="background: var(--cat-8);"></i>Restaurantes</span><span class="j-input"><span class="j-input__prefix">R$</span><input value="500,00"></span></label>
      <label class="j-field"><span class="j-field__label" style="display: inline-flex; align-items: center; gap: 8px;"><i class="j-dotc" style="background: var(--cat-2);"></i>Transporte</span><span class="j-input"><span class="j-input__prefix">R$</span><input value="400,00"></span></label>
    </div>
    <div class="j-card" style="padding: 16px; display: flex; align-items: center; justify-content: space-between; background: var(--surface-2); border: 0;">
      <span class="j-sub">Meta total do mês</span>
      <b style="font: 600 20px/28px Inter, sans-serif;" class="j-num">R$ 4.200,00</b>
    </div>
  </main>
  <footer style="padding: 16px 16px 32px; display: flex; flex-direction: column; gap: 8px;">
    <button class="j-btn j-btn--primary j-btn--lg" type="button">Concluir e ver meu mês</button>
    <button class="j-btn j-btn--ghost" type="button">Pular por enquanto</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }
}
</script>
</body>
</html>
