<!-- @dsCard group="Feedback" height=300 subtitle="Esqueleto, vazio e toast" -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0;padding:16px;background:var(--bg);font-family:var(--font-sans);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.cap{font:600 12px/16px var(--font-sans);letter-spacing:.06em;color:var(--text-2);margin-bottom:8px}
</style>
</head>
<body>
<div><div class="cap">CARREGANDO</div>
<div class="j-card" aria-busy="true" aria-label="Carregando">
<div class="j-skel" style="height:14px;width:40%;margin-bottom:12px"></div>
<div class="j-skel" style="height:36px;width:70%;margin-bottom:12px"></div>
<div class="j-skel" style="height:12px;width:55%"></div>
</div></div>
<div><div class="cap">VAZIO</div>
<div class="j-card j-empty">
<svg width="40" height="40" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 8 A24 24 0 0 0 32 56 Z" style="fill:var(--primary)"/><path d="M32 8 A24 24 0 0 1 32 56" fill="none" style="stroke:var(--primary)" stroke-width="4" stroke-dasharray="4 5" stroke-linecap="round"/></svg>
<div class="j-empty__title">Nenhuma transação ainda</div>
<div class="j-empty__text">Importe um extrato em OFX ou CSV para ver seus gastos aqui.</div>
<button class="j-btn j-btn--primary">Importar extrato</button>
</div></div>
<div><div class="cap">TOAST</div>
<div class="j-toast" role="status"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 12.5L11 15.5L16 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Categoria atualizada em 3 transações</div></div>
</body>
</html>
