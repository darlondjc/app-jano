<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0;padding:16px;background:var(--bg);font-family:var(--font-sans);display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.cap{font:600 12px/16px var(--font-sans);letter-spacing:.06em;color:var(--text-2);margin-bottom:8px}
.phone{width:390px;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;background:var(--bg)}
.phone .body{height:220px;padding:16px;font:400 14px/20px var(--font-sans);color:var(--text-2)}
.side{border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column;width:240px;background:var(--surface)}
.side .j-nav--side{border-right:0;width:auto}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 8px}
.brand span{font:600 24px/1 var(--font-sans);letter-spacing:-0.02em;color:var(--text)}
.brand svg{display:block}
svg{flex:none}
</style>
</head>
