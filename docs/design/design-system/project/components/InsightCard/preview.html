<!-- @dsCard group="Feedback" height=230 subtitle="Leitura do mês com ação" -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0;padding:16px;background:var(--bg);font-family:var(--font-sans);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.act{margin-top:8px}
</style>
</head>
<body>
<div class="j-insight"><div class="j-insight__icon" style="background:var(--warning-soft);color:var(--warning-text)"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 16V4M5 9L10 4L15 9" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<div><div class="j-insight__title">Lazer ficou 24% acima da sua média</div><div class="j-insight__text">R$ 434,00 em outubro contra R$ 350,00 nos últimos 3 meses.</div><div class="act"><button class="j-btn j-btn--ghost" style="height:36px;padding:0 8px">Ajustar meta</button></div></div></div>
<div class="j-insight"><div class="j-insight__icon" style="background:var(--info-soft);color:var(--info)"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="M10 6V10.5M10 13.5V13.6" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg></div>
<div><div class="j-insight__title">Cobrança nova de R$ 39,90</div><div class="j-insight__text">Detectamos uma assinatura que não aparecia antes, em 21 de outubro.</div><div class="act"><button class="j-btn j-btn--ghost" style="height:36px;padding:0 8px">Ver assinatura</button></div></div></div>
<div class="j-insight"><div class="j-insight__icon" style="background:var(--positive-soft);color:var(--positive)"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="M6.5 10.3L9 12.8L13.5 7.5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<div><div class="j-insight__title">Transporte fechou 12% abaixo da meta</div><div class="j-insight__text">Terceiro mês seguido dentro do limite.</div><div class="act"><button class="j-btn j-btn--ghost" style="height:36px;padding:0 8px">Ver histórico</button></div></div></div>
</body>
</html>
