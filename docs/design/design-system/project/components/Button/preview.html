<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0;padding:16px;background:var(--bg);font-family:var(--font-sans);display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.cap{font:500 12px/16px var(--font-sans);color:var(--text-2);width:84px}
</style>
</head>
<body>
<div class="row"><span class="cap">Desktop 40px</span>
<button class="j-btn j-btn--primary">Importar extrato</button>
<button class="j-btn j-btn--secondary">Cancelar</button>
<button class="j-btn j-btn--ghost">Ver detalhes</button>
<button class="j-btn j-btn--danger">Apagar meus dados</button>
<button class="j-btn j-btn--primary" disabled>Salvar meta</button>
</div>
<div class="row"><span class="cap">Mobile 48px</span>
<button class="j-btn j-btn--primary j-btn--lg">Criar meta</button>
<button class="j-btn j-btn--secondary j-btn--lg">Ajustar</button>
</div>
</body>
</html>
