<!-- @dsCard group="Navegação e camadas" height=480 subtitle="Bottom sheet (celular) e painel lateral (desktop)" -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0;padding:16px;background:var(--bg);font-family:var(--font-sans);display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.cap{font:600 12px/16px var(--font-sans);letter-spacing:.06em;color:var(--text-2);margin-bottom:8px}
.phone{position:relative;width:390px;height:420px;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;background:var(--bg)}
.phone .scrim{position:absolute;inset:0;background:var(--overlay)}
.phone .j-sheet{position:absolute;left:0;right:0;bottom:0}
.desk{width:360px;height:420px;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;background:var(--bg);display:flex;justify-content:flex-end}
.desk .j-panel{width:300px;height:100%;display:flex;flex-direction:column;gap:16px}
.btns{display:flex;gap:8px;margin-top:8px}
.hint{font:400 12px/16px var(--font-sans);color:var(--text-2)}
</style>
</head>
<body>
<div><div class="cap">MOBILE · BOTTOM SHEET</div>
<div class="phone"><div class="scrim"></div>
<div class="j-sheet" role="dialog" aria-label="Criar meta">
<div class="j-sheet__handle"></div>
<h2 class="j-sheet__title">Criar meta</h2>
<label class="j-field" style="margin-bottom:12px"><span class="j-field__label">Categoria</span><span class="j-input"><input value="Mercado"></span></label>
<label class="j-field"><span class="j-field__label">Limite mensal</span><span class="j-input"><span class="j-input__prefix">R$</span><input value="900,00"></span><span class="hint">Sugestão: R$ 876,00, a média dos últimos 3 meses.</span></label>
<div class="btns"><button class="j-btn j-btn--primary j-btn--lg" style="flex:1">Salvar meta</button><button class="j-btn j-btn--secondary j-btn--lg">Cancelar</button></div>
</div></div></div>
<div><div class="cap">DESKTOP · PAINEL LATERAL</div>
<div class="desk"><div class="j-panel" role="dialog" aria-label="Detalhe da transação">
<h2 class="j-sheet__title" style="margin:0">Pão de Açúcar</h2>
<div class="hint">27 de outubro · Conta corrente</div>
<div class="j-kpi__value">−R$ 186<span class="j-kpi__cents">,42</span></div>
<label class="j-field"><span class="j-field__label">Categoria</span><span class="j-input"><input value="Mercado"></span></label>
<label class="j-field"><span class="j-field__label">Regra</span><span class="hint">Sempre que a descrição contiver “PÃO DE AÇÚCAR”, usar Mercado.</span></label>
<div class="btns"><button class="j-btn j-btn--primary">Salvar</button><button class="j-btn j-btn--ghost">Criar regra</button></div>
</div></div></div>
</body>
</html>
